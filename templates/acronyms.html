{% extends "base.html" %}
{% block title %}Acronyms · {{ exam_name }}{% endblock %}
{% block headerextra %}
  <div class="exam-hud">
    <span class="hud-item exam-label">{{ exam_name }} · Acronyms</span>
    <span id="progress" class="hud-item">1 / {{ cards|length }}</span>
    <span id="score" class="hud-item">0 correct</span>
  </div>
{% endblock %}
{% block content %}
<div id="ac-root"></div>
<div class="study-nav">
  <button id="prev-btn" class="btn ghost">← Previous</button>
  <button id="next-btn" class="btn primary">Next →</button>
  <a href="{{ url_for('acronyms_setup') }}" class="btn ghost">Done</a>
</div>

<script id="ac-data" type="application/json">{{ cards|tojson }}</script>
<script>
  const CARDS = JSON.parse(document.getElementById("ac-data").textContent);
  const MODE = {{ mode|tojson }};
  const root = document.getElementById("ac-root");
  const state = CARDS.map(() => ({ answered: false, correct: false }));
  let cur = 0, correctCount = 0;

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else n.setAttribute(k, v);
    }
    for (const c of kids) { if (c == null) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return n;
  }

  // Lenient normalization for typed answers: lowercase significant words.
  const STOP = new Set(["a","an","and","as","at","by","for","in","of","on","or","the","to","with"]);
  function tokens(s) {
    return (s.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => !STOP.has(w));
  }
  function typedCorrect(input, accept) {
    const got = tokens(input);
    if (got.length === 0) return false;
    const want = accept.map(w => w.toLowerCase());
    // Correct if every significant word of the canonical expansion is present.
    return want.every(w => got.includes(w));
  }

  function markScore(st) {
    if (st.correct) { correctCount++; document.getElementById("score").textContent = correctCount + " correct"; }
  }

  function render() {
    root.innerHTML = "";
    const c = CARDS[cur], st = state[cur];
    const card = el("article", { class: "fc-card" });
    card.appendChild(el("div", { class: "fc-label" }, "What does this stand for?"));
    card.appendChild(el("p", { class: "fc-acronym" }, c.acronym));

    if (MODE === "multiple_choice") {
      const wrap = el("div", { class: "q-options" });
      c.options.forEach((opt, i) => {
        const b = el("button", { class: "opt-choice fc-opt" }, el("span", {}, opt));
        if (st.answered) {
          b.disabled = true;
          if (i === c.answer_index) b.classList.add("is-correct");
          else if (st.picked === i) b.classList.add("is-chosen-wrong");
        }
        b.addEventListener("click", () => {
          if (st.answered) return;
          st.answered = true; st.picked = i; st.correct = (i === c.answer_index);
          markScore(st); render();
        });
        wrap.appendChild(b);
      });
      card.appendChild(wrap);
      if (st.answered) {
        card.appendChild(el("div", { class: "fc-term-reveal " + (st.correct ? "ok" : "no") },
          el("span", { class: "fc-verdict" }, st.correct ? "✓ Correct" : "✗ Not quite"),
          el("span", {}, " " + c.acronym + " = "), el("strong", {}, c.expansion)));
      }
    } else {
      // typed mode
      const input = el("input", { type: "text", class: "ac-input", placeholder: "Type what it stands for…", autocomplete: "off" });
      if (st.answered) { input.value = st.typed || ""; input.disabled = true; }
      const submit = el("button", { class: "btn accent" }, "Check");
      function grade() {
        if (st.answered) return;
        st.typed = input.value;
        st.correct = typedCorrect(input.value, c.accept_tokens);
        st.answered = true; markScore(st); render();
      }
      submit.addEventListener("click", grade);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") grade(); });
      card.appendChild(el("div", { class: "ac-typed-row" }, input, submit));
      if (!st.answered) card.appendChild(el("p", { class: "fc-hint" }, "Type it and press Enter — grading is instant. (Minor wording/casing is fine.)"));
      if (st.answered) {
        card.appendChild(el("div", { class: "fc-term-reveal " + (st.correct ? "ok" : "no") },
          el("span", { class: "fc-verdict" }, st.correct ? "✓ Correct" : "✗ Not quite"),
          el("span", {}, " " + c.acronym + " = "), el("strong", {}, c.expansion)));
      }
      if (!st.answered) setTimeout(() => input.focus(), 0);
    }

    root.appendChild(card);
    document.getElementById("progress").textContent = (cur + 1) + " / " + CARDS.length;
    document.getElementById("prev-btn").disabled = cur === 0;
    document.getElementById("next-btn").textContent = cur === CARDS.length - 1 ? "Finish" : "Next →";
  }

  function goNext() {
    if (cur < CARDS.length - 1) { cur++; render(); } else window.location = "/acronyms";
  }
  document.getElementById("prev-btn").addEventListener("click", () => { if (cur > 0) { cur--; render(); } });
  document.getElementById("next-btn").addEventListener("click", goNext);
  render();
</script>
{% endblock %}
